name: Check DB contents
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run verification query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "SELECT number, city, format FROM shopping_centers WHERE city IN ('Санкт-Петербург','Москва','Новосибирск','Казань','Самара','Саратов','Краснодар','Красноярск','Ростов-на-Дону','Уфа','Екатеринбург') ORDER BY city, number LIMIT 200;" > /tmp/query.sql
          psql "$DATABASE_URL" -f /tmp/query.sql -A -t -o /tmp/rows.txt || true
          echo "----ROWS----"
          sed -n '1,200p' /tmp/rows.txt || true
      - name: Upload rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-rows
          path: /tmp/rows.txt
