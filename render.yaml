services:
  # ── API (Web Service) ────────────────────────────────────────────────────────
  - type: web
    name: chrono-lenta-ap
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@10 install --frozen-lockfile && npx --yes pnpm@10 --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chrono-lenta-db
          property: connectionString

  # ── Static site (Frontend) ───────────────────────────────────────────────────
  - type: web
    name: chrono-lenta
    runtime: static
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@10 install --frozen-lockfile && npx --yes pnpm@10 --filter @workspace/ad-scheduler run build
    staticPublishPath: artifacts/ad-scheduler/dist/public
    envVars:
      - key: VITE_API_BASE_URL
        value: https://chrono-lenta-ap.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: chrono-lenta-db
    region: frankfurt
    plan: free
